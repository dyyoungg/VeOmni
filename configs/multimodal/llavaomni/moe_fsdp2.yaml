# configs/llava_train.yaml
model:
  model_path: /mnt/afs/share/llava_qwen30B_A3B-veomni-down4
  config_path: /mnt/afs/share/llava_qwen30B_A3B-veomni-down4
  model_arc: qwen2
  vision_tower: /mnt/afs/share/qwen25_vl_encoder
  mm_downsample_ratio: 4
  image_projector_type: avgpool

data:
  train_path: /mnt/afs/yangdeyu/GameMLLM/llava_dev/LLaVA_hub/data/stage2/train_0.jsonl
  eval_path: /mnt/afs/yangdeyu/GameMLLM/LLaVA_hub/exp_data/mvbench_audio_text_ocr_eval.json
  mm_configs:
    image_max_pixels: 602112   # 768*28*28
  sample_fps: 4
  finetune_sample_frames: 64
  preprocess_workers: 2

train:

  num_train_epochs: 1
  seed: 42
  local_rank: 0
  global_rank: 0
  world_size: 8

  # 模型参数
  model_max_length: 4096
  pack_seq: true
  init_device: meta

  freeze_vit: true
  freeze_vit_projector: false
  freeze_audio_tower: true
  freeze_audio_projector: false
  freeze_llm: true
  # 优化器
  optimizer:
    type: adamw
    lr: 2.0e-4
    lr_min: 2.0e-5
    weight_decay: 0.0
    max_grad_norm: 1.0
    lr_decay_style: cosine
    lr_decay_ratio: 1.0
    lr_warmup_ratio: 0.05
    lr_start: 0.0

  vit_lr: 2.0e-4
  min_lr_rate: 0.1
  moe_load_balance_monitor_interval: 10
  enable_mixed_precision: false
  enable_batch_invariant_mode: false
  eval_steps: 0
  gc_steps: 200
  empty_cache_steps: 200
  logging_steps: 20

  gradient_checkpointing:
    enable: true
    debug: false
    enable_reentrant: false

  # FSDP / 并行
  accelerator:
    ulysses_size: 1
    ep_size: 1
    enable_async: false
    fsdp_config:
      fsdp_mode: fsdp2
      full_shard: true
      reshard_after_forward: true
      reshard_after_backward: true
      offload: false
      forward_prefetch: false
    offload_config:
      enable_activation: false
      activation_gpu_limit: 0.8

  # checkpoint
  checkpoint:
    output_dir: /mnt/afs/yangdeyu/GameMLLM/VeOmni-Dev/ckpt/moe_test
    save_steps: 20000000
    save_total_limit: 3
    manager: dcp
    save_hf_weights: false
    save_async: true
 


  wandb:
    enable: true
    project: llavaomni
    name: llavaomni_moe_down4
  # dataloader
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  remote_dataloader: false
  broadcast_model_weights_from_rank0: true